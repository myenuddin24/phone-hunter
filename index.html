<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Hunter</title>
    <!-- Tailwind and daisyUI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <header></header>
    <main class="container mx-auto">
      <!-- search box -->
      <section>
        <div class="flex flex-row items-center justify-center mt-5">
          <label class="input">
            <svg
              class="h-[1em] opacity-50"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2.5"
                fill="none"
                stroke="currentColor"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </g>
            </svg>
            <input
              id="search-field"
              type="search"
              required
              placeholder="Search"
            />
          </label>
          <button onclick="handleSearch()" class="btn btn-accent">
            Search
          </button>
        </div>
      </section>

      <!-- search result -->
      <section>
        <!-- loading spinner -->
        <div id="loading-spinner" class="text-center my-40 hidden">
          <span class="loading loading-spinner loading-xl"></span>
        </div>

        <!-- phones container -->
        <div
          id="phones-container"
          class="grid lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-6 m-10"
        ></div>
        <div id="show-all-container" class="text-center hidden">
          <button onclick="handleShowAll()" class="btn btn-accent">
            Show All
          </button>
        </div>

        <!-- show details modal -->
        <div>
          <!-- Open the modal using ID.showModal() method -->
          <dialog
            id="show_details_modal"
            class="modal modal-bottom sm:modal-middle"
          >
            <div class="modal-box">
              <div id="show-details-container"></div>
              <form method="dialog" class="text-end">
                <!-- if there is a button in form, it will close the modal -->
                <button class="btn bg-red-500 text-white">Close</button>
              </form>
            </div>
          </dialog>
        </div>
      </section>
    </main>
    <footer></footer>

    <!-- script -->
    <script src="script/phone.js"></script>
  </body>
</html>
